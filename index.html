<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAY ONE ACADEMIC CENTRE — Sign Up</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <div class="banner-wrap">
    <img src="assets/banner.jpg" alt="HAY ONE ACADEMIC CENTRE — Join for quality tutorial classes">
  </div>

  <div class="eyebrow">
    <div class="crest"><img src="assets/logo.png" alt="Hay One Academic Centre logo"></div>
    <div class="brand">
      <span class="name">Hay One Academic Centre</span>
      <span class="tag">tutorial registration</span>
    </div>
  </div>

  <div class="card">
    <h1>Welcome</h1>
    <p class="sub">Let's start with your details. This goes straight to your tutor so they know to expect you.</p>

    <form id="signupForm">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="e.g. Ibrahim Musa" required>

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone" placeholder="e.g. 08012345678" required>

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="e.g. you@email.com" required>

      <label for="department">Department</label>
      <input type="text" id="department" name="department" placeholder="e.g. Computer Science" required>

      <div class="error" id="formError">Please fill in all fields correctly.</div>

      <button type="submit" id="submitBtn">Continue to courses →</button>
      <div class="status" id="statusMsg"></div>
    </form>
  </div>

  <p class="footer-note">Having trouble? Call or WhatsApp <a href="tel:07018203064">0701 820 3064</a></p>
</div>

<script src="config.js"></script>
<script>
const form = document.getElementById('signupForm');
const submitBtn = document.getElementById('submitBtn');
const statusMsg = document.getElementById('statusMsg');
const formError = document.getElementById('formError');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  formError.classList.remove('show');

  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const department = document.getElementById('department').value.trim();

  if(!name || !phone || !email || !department){
    formError.textContent = 'Please fill in all fields.';
    formError.classList.add('show');
    return;
  }

  // save for later pages
  sessionStorage.setItem('h1_name', name);
  sessionStorage.setItem('h1_phone', phone);
  sessionStorage.setItem('h1_email', email);
  sessionStorage.setItem('h1_department', department);

  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending...';
  statusMsg.classList.remove('show');

  try {
    if (window.HAYONE_FORM_ENDPOINT && !window.HAYONE_FORM_ENDPOINT.includes('YOUR_FORM_ID')) {
      const fd = new FormData(form);
      fd.append('_subject', 'New sign up — ' + name);
      fd.append('form_type', 'Step 1: Signup');
      const res = await fetch(window.HAYONE_FORM_ENDPOINT, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: fd
      });
      if (!res.ok) throw new Error('Network response was not ok');
    }
    window.location.href = 'courses.html';
  } catch (err) {
    // Even if email sending fails, don't block the student's flow —
    // their details are still saved locally and shown again on later pages.
    console.error(err);
    window.location.href = 'courses.html';
  }
});
</script>
</body>
</html>
